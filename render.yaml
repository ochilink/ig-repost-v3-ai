services:
  - type: web
    name: ig-repost-universal-core
    env: node
    region: oregon
    plan: starter
    buildCommand: cd backend && npm install && pip3 install yt-dlp || pip install yt-dlp
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: PORT
        value: 10000
      - key: IG_USER_ID
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
    healthCheckPath: /